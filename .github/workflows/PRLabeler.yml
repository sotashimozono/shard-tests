# Thin caller. The implementation lives ONCE, in QAtlasHub/.github (public, callable from any
# owner), so the next breakage is one commit there instead of one pull request per repo.
# The labels it applies are what Release Drafter groups the changelog by.
name: PR Labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write            # addLabels / createLabel are issue-scoped, even on a PR

jobs:
  label:
    uses: QAtlasHub/.github/.github/workflows/labeler.yml@v1

name: Release

on:
  push:
    tags: ['v*']

jobs:
  upload:
    # The action downloads a prebuilt binary rather than building at consume time.
    # That is the load-bearing part of the design: the action runs once per shard
    # plus once for the plan, so its own startup cost is multiplied by the shard
    # count. A Docker action's image pull, or a build, would dominate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: shard-tests
          target: ${{ matrix.target }}
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}

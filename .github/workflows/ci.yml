name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --all-targets

  dogfood:
    # Shard this crate's own tests with the binary built from this commit, then
    # assert that the union of what the shards ran is exactly the canonical
    # universe. Deliberately uses the local binary rather than the published
    # action, so it works before any release exists.
    runs-on: ubuntu-latest
    env:
      ENUMERATE: |
        cargo test --quiet -- --list --format terse | sed -n 's/: test$//p'
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release

      - name: Plan
        id: plan
        run: |
          ./target/release/shard-tests plan \
            --enumerate "$ENUMERATE" --target-seconds 1 --max-shards 3

      - name: Run every shard
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: |
          for i in $(seq 1 "$SHARDS"); do
            ./target/release/shard-tests run --index "$i" --units-file "ran-$i.txt" \
              --run 'for u in $SHARD_TESTS_UNITS; do cargo test --quiet -- --exact "$u" > /dev/null; done'
          done

      - name: Every unit ran exactly once
        run: |
          jq -r '.units[].id' shard-tests-plan.json | sort > canonical.txt
          cat ran-*.txt | sort > ran.txt
          # Assert non-empty first: `diff` of two empty files succeeds, so a run that
          # produced nothing at all would otherwise read as a clean pass.
          test -s canonical.txt && test -s ran.txt
          echo "$(wc -l < canonical.txt) units"
          diff canonical.txt ran.txt

  dogfood-derived:
    # The other topology: plan from timings with no build, then let each shard
    # derive membership from the real suite. The invariant under test is that
    # independently-derived slices still partition the REAL universe — including a
    # unit the plan never predicted, which is simulated by dropping one entry from
    # the timings file. If this can fail, a newly added test runs twice or never.
    runs-on: ubuntu-latest
    env:
      ENUMERATE: |
        cargo test --quiet -- --list --format terse | sed -n 's/: test$//p'
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release

      - name: Record the real universe, and a timings file missing one unit
        run: |
          eval "$ENUMERATE" > real.txt
          wc -l < real.txt
          head -n -1 real.txt | jq -R -s 'split("\n") | map(select(length > 0)) | map({key: ., value: 3.0}) | from_entries' > timings.json
          jq 'length' timings.json

      - name: Plan without a build
        id: plan
        run: |
          ./target/release/shard-tests plan \
            --units-from-timings --timings timings.json --target-seconds 6 --max-shards 4

      - name: Each shard derives its own membership
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: |
          for i in $(seq 1 "$SHARDS"); do
            ./target/release/shard-tests run --index "$i" \
              --enumerate "$ENUMERATE" --units-file "derived-$i.txt" --run 'true'
          done

      - name: The derived slices partition the real universe exactly
        run: |
          sort real.txt > want.txt
          cat derived-*.txt | sort > got.txt
          test -s want.txt && test -s got.txt
          echo "$(wc -l < want.txt) units"
          diff want.txt got.txt
          # And the unpredicted unit is owned by exactly one shard, not zero, not two.
          # `grep -l` rather than `grep -c`: with a single shard file `-c` prints a bare
          # count with no `file:` prefix, so a filter on that prefix would read as zero.
          owners=$(grep -l -x -F "$(tail -1 real.txt)" derived-*.txt | wc -l)
          echo "unpredicted unit is owned by $owners shard(s)"
          test "$owners" = "1"

  dogfood-recipe:
    # Guards the recipe table and the timing loop together: plan from a built-in
    # recipe, record what each unit took, merge it, and replan. The second plan
    # must report 100% measured — if the ids the recipe enumerates and the ids it
    # records ever drift apart, that number silently falls instead of failing, so
    # it is asserted rather than eyeballed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release

      - name: Plan from the recipe
        id: plan
        run: ./target/release/shard-tests plan --recipe cargo-test-binaries --target-seconds 1 --max-shards 2

      - name: Run every shard, recording durations
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: |
          for i in $(seq 1 "$SHARDS"); do
            ./target/release/shard-tests run --recipe cargo-test-binaries --index "$i" \
              --runner ubuntu-latest --timings-out "shard-$i.jsonl"
          done

      - name: Merge into the store
        run: |
          jq -r '.units[].id' shard-tests-plan.json > universe.txt
          ./target/release/shard-tests finalize shard-*.jsonl \
            --store timings.jsonl --universe universe.txt
          test -s timings.jsonl
          echo "records: $(wc -l < timings.jsonl)"

      - name: Replanning from the store is fully measured
        run: |
          ./target/release/shard-tests plan --recipe cargo-test-binaries \
            --timings timings.jsonl --runner ubuntu-latest --target-seconds 1 --max-shards 2
          echo "measured_fraction=$(jq -r '.measured_fraction' shard-tests-plan.json)"
          # Compared numerically, not as a string: jq 1.6 renders 1.0 as "1" while
          # 1.7 keeps "1.0", so a string test passes or fails by runner image.
          jq -e '.measured_fraction == 1' shard-tests-plan.json > /dev/null

  # ── The phase actions, assembled as they are meant to be used ────────────────
  #
  # Exercises the artifact handover in particular: an artifact round-trip drops the
  # executable bit, so a hydrated Rust test binary comes back unrunnable. Nothing
  # local can catch that — it needs a real upload and download.
  phases-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - uses: ./build
        with:
          binary: ./target/release/shard-tests
          recipe: cargo-test-binaries
          artifact: phases-build

  phases-organize:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - id: plan
        uses: ./
        with:
          binary: ./target/release/shard-tests
          recipe: cargo-test-binaries
          target-seconds: '1'
          max-shards: '2'
      - uses: actions/upload-artifact@v7
        with:
          name: phases-plan
          path: shard-tests-plan.json
          retention-days: 1

  phases-test:
    needs: [phases-build, phases-organize]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.phases-organize.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - uses: actions/download-artifact@v8
        with:
          name: phases-plan
      # No local build of the suite: the test binaries can only come from the
      # artifact, so this fails outright if the handover does not work.
      - uses: ./run
        with:
          binary: ./target/release/shard-tests
          recipe: cargo-test-binaries
          index: ${{ matrix.index }}
          runner: ubuntu-latest
          build-artifact: phases-build
          timings-out: shard-${{ matrix.index }}.jsonl
          timings-artifact-prefix: phases-timings

  phases-finalize:
    needs: phases-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - uses: ./finalize
        with:
          binary: ./target/release/shard-tests
          pattern: phases-timings-*
          store: timings.jsonl
          artifact: ''
      - name: The store came out non-empty
        run: |
          test -s timings.jsonl
          echo "records: $(wc -l < timings.jsonl)"
          jq -e '.unit and .seconds and .runner == "ubuntu-latest"' timings.jsonl > /dev/null

  # ── Claim-time assignment ────────────────────────────────────────────────────
  #
  # The property under test is exactly-once across shards that never talk to each
  # other: twelve units, six shards, each taking work when it is free. If ref
  # creation were not a compare-and-swap, or the chunking could hand the same unit
  # out twice, the union below would not be the universe.
  claim:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: Plan, identically in every shard
        run: |
          ./target/release/shard-tests plan \
            --recipe synthetic-small --recipe-file measurements/synthetic.json \
            --min-shards 6 --max-shards 6
      - name: Claim and run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/shard-tests run --claim \
            --recipe synthetic-small --recipe-file measurements/synthetic.json \
            --index ${{ matrix.index }} --runner ubuntu-latest \
            --timings-out claimed-${{ matrix.index }}.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: claim-records-${{ matrix.index }}
          path: claimed-${{ matrix.index }}.jsonl
          if-no-files-found: ignore
          retention-days: 1

  claim-verify:
    needs: claim
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - uses: actions/download-artifact@v8
        with:
          pattern: claim-records-*
          path: records
          merge-multiple: true
      - name: Every unit ran exactly once, across shards that never coordinated
        run: |
          set -euo pipefail
          cat records/*.jsonl | jq -r .unit | sort > ran.txt
          seq -w 1 12 | sed 's/^/unit-/' | sort > want.txt
          test -s ran.txt && test -s want.txt
          echo "units executed: $(wc -l < ran.txt)"
          diff want.txt ran.txt
          # Distribution is informational: how the work actually split is the point of
          # claiming, but any split that covers the universe once is correct.
          for f in records/*.jsonl; do echo "  $(basename "$f"): $(wc -l < "$f") unit(s)"; done
      - name: Release the claims
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/shard-tests finalize records/*.jsonl \
            --store /tmp/store.jsonl --drop-claims "${{ github.run_id }}"
      - name: The namespace is empty again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          left=$(gh api "repos/${{ github.repository }}/git/matching-refs/kleroterion/${{ github.run_id }}" --jq 'length')
          echo "refs left: $left"
          test "$left" = "0"

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Pre-1.0 semantics: additive changes are a patch, breaking changes are a minor.
version-resolver:
  major:
    labels: ['major']
  minor:
    labels:
      - 'minor'
      - 'breaking'
  patch:
    labels: ['patch']
  default: patch

categories:
  - title: '💥 Breaking changes'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'enhancement'
      - 'feature'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '⚡ Performance'
    labels:
      - 'performance'
  - title: '🧪 Recipes'
    labels:
      - 'recipe'
  - title: '📖 Documentation'
    labels:
      - 'documentation'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'refactor'
      - 'dependencies'

template: |
  ## Changelog

  $CHANGES

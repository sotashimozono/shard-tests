name: 'shard-tests run'
description: "Run one shard's share of a shard-tests plan"
author: 'Sota Shimozono'
branding:
  icon: 'divide'
  color: 'purple'

inputs:
  binary:
    description: >
      Use this shard-tests binary instead of downloading a release. Lets a repository test the
      actions against a build of its own, and covers platforms with no published archive.
    required: false
    default: ''
  build-artifact:
    description: >
      Download this artifact before running, to hydrate what the build phase handed over. Empty
      when the recipe has no build phase, or when the build happened in this job.
    required: false
    default: ''
  timings-artifact-prefix:
    description: >
      Upload the recorded timings under this name plus the shard index, which is what the
      finalize action collects. Requires timings-out. Empty skips the upload.
    required: false
    default: 'shard-tests-timings'
  recipe:
    description: 'Built-in recipe supplying the hooks. `shard-tests recipes` lists them.'
    required: false
    default: ''
  extra:
    description: 'Passed to the hooks as $SHARD_TESTS_EXTRA (coverage or feature flags)'
    required: false
    default: ''
  runner:
    description: 'Name recorded with each timing, and the one plan --runner selects on'
    required: false
    default: ''
  timings-out:
    description: 'Append a timing record per unit here, as JSONL'
    required: false
    default: ''
  derive:
    description: >
      Derive membership from this shard's own build using the recipe's enumerate hook. Needed
      when the plan was made with units-from-timings, so a unit it did not predict still runs.
    required: false
    default: 'false'
  index:
    description: '1-based shard index, i.e. the matrix value from the plan job'
    required: true
  run:
    description: >
      Shell snippet executed with SHARD_TESTS_UNITS set to this shard's ids. Optional when a
      recipe supplies one; given here it overrides the recipe's.
    required: false
    default: ''
  enumerate:
    description: >
      Shell snippet printing one unit id per line, evaluated in this shard. Give this when the
      plan was made with units-from-timings: it makes real membership authoritative, so a unit
      the plan did not predict is still assigned rather than silently skipped. Must be cheap —
      listing from a hydrated build artifact qualifies, compiling the suite again does not.
    required: false
    default: ''
  claim:
    description: >
      Take work when free instead of running a slice fixed at plan time. Falls back to the
      static slice, with a line saying so, when the job cannot create refs — which is the case
      for a pull request from a fork. Needs contents:write and a token in GH_TOKEN.
    required: false
    default: 'false'
  fail-on-drift:
    description: 'Treat any difference between the predicted and real universe as an error'
    required: false
    default: 'false'
  plan:
    description: 'Path to the plan written by the plan job'
    required: false
    default: 'shard-tests-plan.json'
  separator:
    description: 'String joining the unit ids in SHARD_TESTS_UNITS. Defaults to a newline.'
    required: false
    default: ''
  units-file:
    description: 'Also write the unit ids, one per line, to this path'
    required: false
    default: ''
  version:
    description: 'shard-tests release to download'
    required: false
    default: 'v0.1.10'

runs:
  using: composite
  steps:
    - name: Install shard-tests
      shell: bash
      env:
        ST_VERSION: ${{ inputs.version }}
        ST_BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/shard-tests-bin"
        mkdir -p "$dir"
        if [ -n "${ST_BINARY:-}" ]; then
          cp "$ST_BINARY" "$dir/shard-tests"
          chmod +x "$dir/shard-tests"
          echo "$dir" >> "$GITHUB_PATH"
          echo "shard-tests: using the supplied binary $ST_BINARY"
          exit 0
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)    target=x86_64-unknown-linux-musl ;;
          Linux-ARM64)  target=aarch64-unknown-linux-musl ;;
          macOS-X64)    target=x86_64-apple-darwin ;;
          macOS-ARM64)  target=aarch64-apple-darwin ;;
          Windows-X64)  target=x86_64-pc-windows-msvc ;;
          *) echo "shard-tests: unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        base="https://github.com/sotashimozono/shard-tests/releases/download/${ST_VERSION}"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          curl -fsSL "${base}/shard-tests-${target}.zip" -o "${dir}/shard-tests.zip"
          unzip -q -o "${dir}/shard-tests.zip" -d "$dir"
        else
          curl -fsSL "${base}/shard-tests-${target}.tar.gz" | tar xz -C "$dir"
        fi
        echo "$dir" >> "$GITHUB_PATH"

    - name: Hydrate the build
      if: inputs.build-artifact != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.build-artifact }}

    - name: Run shard
      shell: bash
      # See the note in the plan action: recipes go through the environment so
      # they are never interpolated into this script.
      env:
        ST_DERIVE: ${{ inputs.derive }}
        ST_CLAIM: ${{ inputs.claim }}
        ST_RECIPE: ${{ inputs.recipe }}
        ST_EXTRA: ${{ inputs.extra }}
        ST_RUNNER: ${{ inputs.runner }}
        ST_TIMINGS_OUT: ${{ inputs.timings-out }}
        ST_RUN: ${{ inputs.run }}
        ST_PLAN: ${{ inputs.plan }}
        ST_INDEX: ${{ inputs.index }}
        ST_ENUMERATE: ${{ inputs.enumerate }}
        ST_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
        ST_SEPARATOR: ${{ inputs.separator }}
        ST_UNITS_FILE: ${{ inputs.units-file }}
      run: |
        set -euo pipefail
        args=(run --plan "$ST_PLAN" --index "$ST_INDEX")
        # Conditional: passing an empty --run would override the recipe's test
        # command with nothing, which fails in a way that looks like a recipe bug.
        if [ -n "$ST_RUN" ]; then args+=(--run "$ST_RUN"); fi
        if [ -n "$ST_ENUMERATE" ]; then args+=(--enumerate "$ST_ENUMERATE"); fi
        if [ "$ST_FAIL_ON_DRIFT" = "true" ]; then args+=(--fail-on-drift); fi
        if [ -n "$ST_SEPARATOR" ]; then args+=(--separator "$ST_SEPARATOR"); fi
        if [ -n "$ST_UNITS_FILE" ]; then args+=(--units-file "$ST_UNITS_FILE"); fi
        if [ -n "$ST_RECIPE" ]; then args+=(--recipe "$ST_RECIPE"); fi
        if [ -n "$ST_EXTRA" ]; then args+=(--extra "$ST_EXTRA"); fi
        if [ -n "$ST_RUNNER" ]; then args+=(--runner "$ST_RUNNER"); fi
        if [ -n "$ST_TIMINGS_OUT" ]; then args+=(--timings-out "$ST_TIMINGS_OUT"); fi
        if [ "$ST_DERIVE" = "true" ]; then args+=(--derive); fi
        if [ "$ST_CLAIM" = "true" ]; then args+=(--claim); fi
        shard-tests "${args[@]}"

    - name: Hand the records to finalize
      if: always() && inputs.timings-out != '' && inputs.timings-artifact-prefix != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.timings-artifact-prefix }}-${{ inputs.index }}
        path: ${{ inputs.timings-out }}
        if-no-files-found: ignore
        retention-days: 1
